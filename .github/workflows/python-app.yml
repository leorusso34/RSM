name: Python Code Check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check-python:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install Ruff
        run: pip install ruff

      - name: Check Python code
        run: ruff check .
